# fly.toml — Mythos2099 API (WebSocket game server)
#
# Deploy from repo root:
#   fly deploy . --config server/fly.toml --dockerfile server/Dockerfile --yes
# (or: npm run deploy:api)
#
# First-time setup:
#   fly apps create mythos2099-api
#   fly tokens create deploy -a mythos2099-api -x 720h -n "mythos2099-api deploy"
#   $env:FLY_API_TOKEN = "FlyV1 ..."   # PowerShell — do not commit
#   npm run deploy:api
#

app = 'mythos2099-api'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[env]
  PORT = "8787"
  NODE_ENV = "production"
  DATA_DIR = "/data"
  # Comma-separated browser Origins allowed to open /ws (empty = allow all, for local).
  ALLOWED_ORIGINS = "https://mythos2099-web.fly.dev"
  ROOM_IDLE_MS = "1800000"
  ROOM_CLEANUP_MS = "60000"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
